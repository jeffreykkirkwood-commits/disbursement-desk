# gitleaks config: keep every built-in rule, plus two narrow Cloudflare rules.
# gitleaks auto-loads this file from the repo root, so secret-scan.yml needs no flag.
#
# Why: the built-in cloudflare-api-key rule only fires when the word "cloudflare"
# is in the variable name. A token in a CF_-prefixed variable (e.g. CF_API_TOKEN)
# is only caught by generic-api-key, which skips any value that happens to contain
# one of its ~1,500 stopwords (e.g. "admin", "about"), so roughly 1 in 25 random
# Cloudflare tokens would slip through. This rule has no stopwords.
# Tests generate fake tokens at runtime; never commit a token-shaped string.

[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token-cf-prefix"
description = "Cloudflare API token (40 chars) assigned to a CF_-prefixed variable, e.g. CF_API_TOKEN."
regex = '''(?i)\bcf[_.-](?:[\w.-]{0,20}[_.-])?(?:api[_.-]?)?(?:token|key)\b[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9_-]{40})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3.5
keywords = ["cf_", "cf-", "cf."]

# Cloudflare's scannable format (all new or rolled credentials since Apr 2026):
# prefix + 40 alphanumeric chars + 8-char hex CRC32 checksum. Matches even with no
# variable name next to it. Sources:
# https://developers.cloudflare.com/fundamentals/api/get-started/token-formats/
# https://developers.cloudflare.com/cloudflare-one/data-loss-prevention/dlp-profiles/predefined-profiles/
[[rules]]
id = "cloudflare-scannable-token"
description = "Cloudflare scannable API credential: cfut_ (user token), cfat_ (account token) or cfk_ (global key)."
regex = '''\b(?:cfut|cfat|cfk)_[A-Za-z0-9]{40}[0-9a-fA-F]{8}\b'''
keywords = ["cfut_", "cfat_", "cfk_"]
