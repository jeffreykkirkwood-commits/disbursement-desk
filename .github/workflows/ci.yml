# FEATURE — Continuous checks for the Disbursement Desk.
# Runs the Python unittest suite (temporary databases, loopback ports). The Lab's Node
# payment-form client test stays in payments-api-simulator; it is not part of the Desk.
# No Dwolla credentials, no network calls to providers, no Render deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches Render's PYTHON_VERSION; 3.10 is the oldest with Gunicorn 26.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: pip-audit pinned dependencies
        # Audit the packages just installed from the pin file. --no-deps
        # --disable-pip skips a nested venv (needs only the active interpreter).
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --no-deps --disable-pip

      - name: Python tests
        run: python -m unittest -v
