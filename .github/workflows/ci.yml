# FEATURE — Continuous checks for the Payments API Simulator.
# Runs the Python unittest suite (temporary databases, loopback ports) and the Node
# payment-form client test. No Dwolla credentials, no network calls to providers,
# no Render deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches Render's PYTHON_VERSION; 3.10 is the oldest with Gunicorn 26.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Python tests
        run: python -m unittest -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Payment form client test
        run: node test-payment-client.cjs
